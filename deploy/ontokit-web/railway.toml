[build]
# Uses existing Dockerfile with build args
dockerfilePath = "Dockerfile"

[build.args]
NEXT_PUBLIC_API_URL = "${{ontokit-api.RAILWAY_PUBLIC_DOMAIN}}"
NEXT_PUBLIC_WS_URL = "wss://${{ontokit-api.RAILWAY_PUBLIC_DOMAIN}}"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[service]
internalPort = 3000
