name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-test.txt

      - name: Verify required test inputs
        run: |
          python -c "import folio.iri"
          test -f FOLIO.owl
          test -f FOLIO-webprotege-merge-output.owl

      - name: Run tests
        run: python -m pytest tests -q -ra
