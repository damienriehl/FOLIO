name: OpenGloss mapping heartbeat

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [FOLIO.owl]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opengloss-mapping-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/requirements-authoring.txt pytest
      - name: Check for an open heartbeat pull request
        id: pending
        run: |
          set -euo pipefail
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("heartbeat/opengloss-"))] | length')
          if [ "$count" -gt 0 ]; then
            echo '::notice::An OpenGloss heartbeat pull request is already open; skipping regeneration.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
      - name: Regenerate mappings and receipt
        id: heartbeat
        if: steps.pending.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/opengloss_heartbeat.py --repo-root . --output-decision "$RUNNER_TEMP/opengloss-decision"
      - name: Detect changed mapping files
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- mappings/opengloss)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests
        id: tests
        continue-on-error: true
        if: steps.changes.outputs.changed == 'true'
        run: python -m pytest tests -q
      - name: Publish heartbeat pull request
        if: always() && steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          decision=$(cat "$RUNNER_TEMP/opengloss-decision")
          case "$decision" in
            auto|needs-damien) ;;
            *) echo 'Invalid heartbeat decision'; exit 1 ;;
          esac
          if [ "${{ steps.tests.outcome }}" = failure ]; then
            decision=needs-damien
          fi
          receipt=$(git ls-files --others --exclude-standard mappings/opengloss/receipts | sort | tail -1)
          test -n "$receipt"
          branch="heartbeat/opengloss-$(date -u +%F)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add mappings/opengloss
          git commit -m "Update OpenGloss mappings; receipt $receipt"
          git push --set-upstream origin "$branch"
          export RECEIPT="$receipt" DECISION="$decision" TEST_OUTCOME="${{ steps.tests.outcome }}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(Path(os.environ['RECEIPT']).read_text())
          body = '\n'.join([
              f"Decision: **{os.environ['DECISION']}**",
              'Tests failed; manual review required.' if os.environ['TEST_OUTCOME'] == 'failure' else 'Tests passed.',
              f"Receipt: `{os.environ['RECEIPT']}`",
              '',
              '```json',
              json.dumps(receipt, indent=2, sort_keys=True),
              '```',
          ])
          Path(os.environ['RUNNER_TEMP'], 'opengloss-pr.md').write_text(body + '\n')
          PY
          label="heartbeat:$decision"
          gh label create --repo "$GITHUB_REPOSITORY" "$label" --force --description "OpenGloss heartbeat decision: $decision"
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "OpenGloss mapping heartbeat $(date -u +%F)" --body-file "$RUNNER_TEMP/opengloss-pr.md" --label "$label")
          if [ "$decision" = auto ]; then
            # GITHUB_TOKEN PRs do not trigger Tests; this job's pytest run is the gate.
            if ! gh pr merge --repo "$GITHUB_REPOSITORY" --squash --delete-branch "$pr"; then
              echo '::error::OpenGloss heartbeat merge failed; the pull request remains open.'
              exit 1
            fi
          fi
      - name: Upload mapping artifacts and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opengloss-mapping-heartbeat-${{ github.run_id }}
          path: mappings/opengloss
      - name: Report heartbeat failure
        if: always() && (steps.heartbeat.outcome == 'failure' || steps.tests.outcome == 'failure')
        run: |
          echo '::error::Heartbeat regeneration or tests failed. Check the step logs, uploaded artifacts, and any created pull request for evidence.'
          exit 1
