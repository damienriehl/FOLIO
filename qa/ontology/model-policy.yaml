version: 1
review_schema: schemas/ontology-review.schema.json
routes:
  primary:
    provider: openai
    model: gpt-5.6-sol
    reasoning: high
  independent:
    provider: google
    model: gemini-3.5-flash
    reasoning: high
  benchmark_adjudicator:
    provider: openai
    model: gpt-5.6-terra
    reasoning: high
  correction_proposer:
    provider: openai
    model: gpt-5.6-sol
    reasoning: high
  correction_verifier_1:
    provider: google
    model: gemini-3.5-flash
    reasoning: high
  correction_verifier_2:
    provider: openai
    model: gpt-5.6-terra
    reasoning: high
forbidden_providers:
  - anthropic
  - claude
terminal_verdicts:
  - pass
  - defect
  - abstain
minimum_confidence: 0.90
minimum_scored_cases_per_slice: 2
required_slices:
  definition: [en, en-us]
  example: [en, en-us]
  translation:
    - ar-sa
    - de-de
    - en-au
    - en-ca
    - en-gb
    - en-us
    - es
    - es-es
    - es-mx
    - fr
    - fr-fr
    - he
    - he-il
    - hi
    - hi-in
    - it-it
    - ja
    - ja-jp
    - ko-kr
    - pt-br
    - ru-ru
    - zh
    - zh-cn
qualification:
  minimum_accuracy: 0.90
  minimum_defect_recall: 0.95
  maximum_false_accept_rate: 0.02
  require_all_locale_family_slices: true
  require_repeat_stability: true
operations:
  batch_size: 25
  maximum_output_tokens_per_request: 16384
  maximum_requests: 1000
  maximum_input_tokens: 5000000
  maximum_output_tokens: 5000000
  maximum_cost_usd: 250.00
  pricing:
    "openai:gpt-5.6-sol":
      input_per_million: 5.00
      output_per_million: 30.00
    "google:gemini-3.5-flash":
      input_per_million: 1.50
      output_per_million: 9.00
    "openai:gpt-5.6-terra":
      input_per_million: 2.50
      output_per_million: 15.00
